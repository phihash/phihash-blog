<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>phihash</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        max-width: 72rem;
        margin: 0 auto;
        padding: 3rem 1.25rem;
        font-family: system-ui, sans-serif;
        line-height: 1.7;
        background: light-dark(#fafaf9, #111);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
        gap: 1.25rem;
        padding: 0;
        list-style: none;
      }
      .card {
        display: block;
        height: 100%;
        overflow: hidden;
        border: 1px solid light-dark(#e7e5e4, #2a2a2a);
        border-radius: 1rem;
        background: light-dark(#fff, #1a1a1a);
        color: inherit;
        text-decoration: none;
      }
      .thumb {
        display: grid;
        place-items: center;
        aspect-ratio: 2 / 1;
        background: light-dark(#f0eeec, #242424);
        font-size: 3.5rem;
      }
      .body {
        padding: 1rem 1.25rem 1.25rem;
      }
      .body h2 {
        margin: 0 0 0.25rem;
        font-size: 1.05rem;
      }
      .body p {
        margin: 0;
        font-size: 0.875rem;
        color: light-dark(#78716c, #a8a29e);
      }
    </style>
  </head>
  <body>
    <h1>phihash</h1>
    <ul class="cards">
      <li>
        <a class="card" href="dev.html">
          <div class="thumb">🛠️</div>
          <div class="body">
            <h2>個人開発</h2>
            <p>個人開発で役立つ記事</p>
          </div>
        </a>
      </li>
      <li>
        <a class="card" href="stack.html">
          <div class="thumb">🧰</div>
          <div class="body">
            <h2>道具箱</h2>
            <p>使っているツール・サービス・資料・スキル</p>
          </div>
        </a>
      </li>
      <li>
        <a class="card" href="tips.html">
          <div class="thumb">💡</div>
          <div class="body">
            <h2>小ネタ</h2>
            <p>身につくまで置いておくメモ</p>
          </div>
        </a>
      </li>
      <li>
        <a class="card" href="tsundoku.html">
          <div class="thumb">📚</div>
          <div class="body">
            <h2>積読</h2>
            <p>あとで読むもの</p>
          </div>
        </a>
      </li>
      <li>
        <a class="card" href="devenv.html">
          <div class="thumb">💻</div>
          <div class="body">
            <h2>開発環境</h2>
            <p>使っているマシン・エディタ・設定</p>
          </div>
        </a>
      </li>
    </ul>
  </body>
</html>
